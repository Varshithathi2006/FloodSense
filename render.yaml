services:
  - type: web
    name: floodsense-api
    runtime: python
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --chdir dashboard server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 600
    healthCheckPath: /api/status
